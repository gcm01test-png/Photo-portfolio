<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ภาพถ่ายวิลล่า | พอร์ตโฟลิโอช่างภาพ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+Thai:wght@300;400;500;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f6f2;
  --surface:#ffffff;
  --panel:#efeae1;
  --ink:#151a22;
  --muted:#5d646b;
  --line:#ded7ca;
  --accent:#9c7a44;
  --accent-soft:rgba(156,122,68,.12);
  --on-accent:#ffffff;
  --shadow:0 20px 50px rgba(21,26,34,.07);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-padding-top:76px;scroll-behavior:smooth}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1215;
    --surface:#151a1e;
    --panel:#1c2227;
    --ink:#f1ede6;
    --muted:#9da4ab;
    --line:#293138;
    --accent:#c8a472;
    --accent-soft:rgba(200,164,114,.14);
    --on-accent:#13100c;
    --shadow:0 24px 60px rgba(0,0,0,.42);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1215;
  --surface:#151a1e;
  --panel:#1c2227;
  --ink:#f1ede6;
  --muted:#9da4ab;
  --line:#293138;
  --accent:#c8a472;
  --accent-soft:rgba(200,164,114,.14);
  --on-accent:#13100c;
  --shadow:0 24px 60px rgba(0,0,0,.42);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:300 16px/1.75 "Prompt","Noto Sans Thai",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{
  font-family:"Cormorant Garamond","Noto Serif Thai",Georgia,serif;
  font-weight:400;
  line-height:1.22;
  margin:0;
}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}

.wrap{max-width:1200px;margin:0 auto;padding:0 28px}

/* Sticky Topbar */
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
header{
  display:flex;
  justify-content:space-between;
